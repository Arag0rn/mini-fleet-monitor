server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
