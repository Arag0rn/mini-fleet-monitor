# Included in every location: an add_header inside a location drops all add_header lines from server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# The hash allows the inline theme script in index.html; recompute it whenever that script changes.
# connect-src must match VITE_API_URL (http://localhost:4000 in docker-compose.yml).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-meF5tYljH6ySCVJPk3Hfwtrh/pD3kNH9zaXMzXAHdbA='; style-src 'self'; font-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' http://localhost:4000 ws://localhost:4000; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
